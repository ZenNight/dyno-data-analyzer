[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dyno-data-analyzer"
version = "0.1.0"
description = "Analyze engine dyno logs: torque and power curves, peaks, exhaust gas temperature spread, and run comparison."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Leonardo Barbiero Reis"}]
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dyno = "dyno.cli:main"

[tool.setuptools.packages.find]
include = ["dyno*"]
